[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-validation-platform"
version = "0.1.0"
description = "Vehicle software validation and test automation MVP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vijay Bamini" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "lifecycle: spawns and manages real ECU subprocesses (requires PYTHONPATH on src)",
]
